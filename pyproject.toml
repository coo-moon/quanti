[project]
name = "quanti"
version = "0.1.0"
description = "A-share quantitative trading system"
requires-python = ">=3.11"
dependencies = [
    "akshare>=1.12",
    "pandas>=2.1",
    "numpy>=1.26",
    "sqlalchemy>=2.0",
    "pydantic>=2.5",
    "fastapi>=0.109",
    "uvicorn>=0.27",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.23",
    "ruff>=0.2",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100
