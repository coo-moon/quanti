[project]
name = "quanti"
version = "0.1.0"
description = "A-share quantitative trading system"
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["quant", "trading", "a-share", "backtest", "quantitative-finance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "akshare>=1.12",
    "pandas>=2.1",
    "numpy>=1.26",
    "sqlalchemy>=2.0",
    "pydantic>=2.5",
    "fastapi>=0.109",
    "uvicorn>=0.27",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.23",
    "ruff>=0.2",
]
# Install via `pip install -e '.[llm]'` to enable the LLM-driven agent
# runtime (Phase 3). Without it, agent_mode="llm" raises a clear ImportError
# at construction time; the rest of the system works unchanged.
llm = [
    "anthropic>=0.40",
]

[project.scripts]
quanti = "quanti.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["quanti*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100
